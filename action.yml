name: "Text Token Counts"
description: "Count lowercase ASCII alphanumeric tokens in text and return deterministic token frequencies."
inputs:
  payload:
    description: "JSON payload consumed by the action"
    required: true
outputs:
  result:
    description: "Compact JSON result produced by the action"
runs:
  using: "node24"
  main: "index.js"
branding:
  icon: "check-circle"
  color: "blue"
